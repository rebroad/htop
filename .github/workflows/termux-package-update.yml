name: Notify Termux package repository

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    env:
      TERMUX_PACKAGES_DISPATCH_TOKEN: ${{ secrets.TERMUX_PACKAGES_DISPATCH_TOKEN }}
    steps:
      - name: Trigger Termux source refresh
        if: ${{ env.TERMUX_PACKAGES_DISPATCH_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.TERMUX_PACKAGES_DISPATCH_TOKEN }}
        run: gh api repos/rebroad/termux-packages/dispatches -f event_type=rebroad-htop-updated

      - name: Report missing dispatch token
        if: ${{ env.TERMUX_PACKAGES_DISPATCH_TOKEN == '' }}
        run: echo '::warning title=Termux package refresh not triggered::Add TERMUX_PACKAGES_DISPATCH_TOKEN to rebroad/htop Actions secrets.'
